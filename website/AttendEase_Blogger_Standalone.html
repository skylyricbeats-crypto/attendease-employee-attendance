<!-- Attendance standalone Blogger HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance | Employee Attendance & Leave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root{--navy:#172554;--blue:#2563eb;--sky:#eaf2ff;--ink:#172033;--muted:#6b7280;--line:#e6eaf0;--bg:#f7f9fc;--green:#16845b;--green-bg:#e9f8f0;--orange:#c76b14;--orange-bg:#fff5e8;--red:#c24155;--red-bg:#fff0f2;--shadow:0 12px 35px rgba(31,53,87,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,'Noto Sans Bengali',sans-serif}.app-shell{display:flex;min-height:100vh}.sidebar{width:252px;background:linear-gradient(180deg,#111d46,#182858);color:#dbe6ff;padding:24px 15px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:5}.brand{display:flex;align-items:center;gap:11px;padding:4px 12px 36px}.brand-mark{width:40px;height:40px;border-radius:13px;background:#5a8cff;color:white;display:grid;place-items:center;font-weight:800}.brand strong{display:block;color:#fff;font-size:18px}.brand span{font-size:11px;color:#9fb2e0}.nav-list{display:grid;gap:8px}.nav-item{border:0;background:transparent;color:#afbee1;text-align:left;padding:13px 15px;border-radius:12px;font:600 14px Inter;cursor:pointer;display:flex;gap:13px;align-items:center}.nav-item span{font-size:19px;width:20px;text-align:center}.nav-item:hover,.nav-item.active{background:#2d4381;color:#fff}.sidebar-footer{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding:18px 4px 0;display:flex;align-items:center;gap:9px}.sidebar-footer b{display:block;font-size:12px;color:#fff}.sidebar-footer small{font-size:10px;color:#9fb2e0}.mini-avatar{width:33px;height:33px;border-radius:50%;background:#e7b788;color:#5d331b;display:grid;place-items:center;font-weight:700;font-size:11px}.sidebar-footer .icon-button{margin-left:auto}.main-content{margin-left:252px;width:calc(100% - 252px)}.topbar{height:78px;padding:0 4.2%;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}.breadcrumb{display:flex;gap:12px;align-items:center;font-size:14px}.breadcrumb span{color:#9aa2b1}.breadcrumb b{color:#c4cad4}.breadcrumb strong{color:var(--ink)}.top-actions{display:flex;align-items:center;gap:16px}.icon-button{border:0;background:transparent;color:#8c96a7;cursor:pointer;font-size:17px;position:relative}.icon-button i{position:absolute;width:6px;height:6px;border-radius:50%;background:#ef5468;right:0;top:1px}.date-chip{background:#f6f8fb;border:1px solid var(--line);padding:9px 13px;border-radius:10px;color:#5b6474;font-size:12px}.menu-button{display:none}.page{padding:34px 4.2% 50px;max-width:1480px;margin:auto}.eyebrow{color:var(--blue);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}.page-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.page h1{font-size:30px;margin:5px 0 4px;letter-spacing:-.04em}.subtitle{color:var(--muted);font-size:13px;margin:0}.primary-btn{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:11px 16px;font-weight:700;cursor:pointer;box-shadow:0 5px 15px rgba(37,99,235,.2)}.secondary-btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;border-radius:9px;font-weight:600;cursor:pointer}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:22px}.stat-card,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat-card{padding:20px;display:flex;justify-content:space-between}.stat-card h3{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 14px}.stat-value{font-size:28px;font-weight:800;letter-spacing:-.05em}.stat-note{font-size:11px;color:var(--green);margin-top:7px}.stat-icon{width:43px;height:43px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--sky);color:var(--blue)}.content-grid{display:grid;grid-template-columns:1.45fr 1fr;gap:20px}.panel-header{display:flex;align-items:center;justify-content:space-between;padding:19px 21px;border-bottom:1px solid var(--line)}.panel-header h2{font-size:15px;margin:0}.panel-header a{font-size:12px;color:var(--blue);font-weight:700;cursor:pointer}.panel-body{padding:0 21px 18px}.employee-row{display:flex;align-items:center;gap:11px;padding:14px 0;border-bottom:1px solid #f0f2f5}.employee-row:last-child{border:0}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}.employee-info{flex:1}.employee-info b{font-size:12px;display:block}.employee-info small{font-size:11px;color:var(--muted)}.status{font-size:10px;font-weight:700;border-radius:20px;padding:5px 9px}.present{background:var(--green-bg);color:var(--green)}.late{background:var(--orange-bg);color:var(--orange)}.absent{background:var(--red-bg);color:var(--red)}.activity{padding:16px 0;border-bottom:1px solid #f0f2f5;display:flex;gap:12px}.activity:last-child{border:0}.activity-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:5px}.activity b{font-size:12px}.activity small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;font-size:12px}.data-table th{text-align:left;color:#8791a1;font-size:11px;padding:13px 18px;background:#fbfcfe;border-bottom:1px solid var(--line);white-space:nowrap}.data-table td{padding:14px 18px;border-bottom:1px solid #f0f2f5;white-space:nowrap}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px}.search{flex:1;border:1px solid var(--line);padding:11px 13px;border-radius:9px;font:13px Inter;outline:none}.filter{border:1px solid var(--line);background:#fff;padding:11px;border-radius:9px;color:var(--muted)}.profile{display:flex;align-items:center;gap:10px}.profile .avatar{width:33px;height:33px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:22px}.form-group{display:grid;gap:7px}.form-group label{font-size:12px;color:#5d6675;font-weight:600}.form-group input,.form-group select,.form-group textarea{border:1px solid var(--line);border-radius:8px;padding:11px;font:13px Inter;outline:none}.form-group textarea{min-height:95px;resize:vertical}.full{grid-column:1/-1}.form-actions{padding:0 22px 22px;display:flex;justify-content:flex-end;gap:10px}.empty{padding:35px;text-align:center;color:var(--muted);font-size:13px}.toast{position:fixed;right:24px;bottom:24px;background:#152347;color:#fff;border-radius:10px;padding:13px 17px;font-size:12px;box-shadow:var(--shadow);transform:translateY(100px);opacity:0;transition:.25s;z-index:20}.toast.show{transform:translateY(0);opacity:1}.muted{color:var(--muted)}@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main-content{margin-left:0;width:100%}.menu-button{display:block;border:0;background:transparent;font-size:20px;color:var(--navy)}.topbar{gap:12px}.breadcrumb{margin-right:auto}.date-chip{display:none}.stats-grid{grid-template-columns:repeat(2,1fr)}.content-grid{grid-template-columns:1fr}.page{padding:25px 4%}}@media(max-width:570px){.page-heading{display:block}.page-heading .primary-btn{margin-top:16px}.stats-grid{gap:10px}.stat-card{padding:14px}.stat-value{font-size:23px}.stat-icon{width:35px;height:35px;font-size:16px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.topbar{height:64px}.page h1{font-size:25px}}

.avatar{overflow:hidden;position:relative}.avatar img{width:100%;height:100%;object-fit:cover;display:block}.avatar span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700}.avatar img + span{display:none}

.name-bn{display:block!important;color:#4f6b9b!important;font-family:Arial,'Noto Sans Bengali',sans-serif;font-size:11px!important;margin-top:3px;line-height:1.35}.employee-info .name-bn{font-weight:600}.data-table .profile>div{display:grid;gap:2px}.data-table .profile b{font-size:12px}

  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">AT</div><div><strong>Attendance</strong><span>HR Workspace</span></div></div>
      <nav class="nav-list" aria-label="Primary navigation">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span> Dashboard</button>
        <button class="nav-item" data-view="employees"><span>♙</span> Employees</button>
        <button class="nav-item" data-view="attendance"><span>✓</span> Attendance</button>
        <button class="nav-item" data-view="leave"><span>▣</span> Leave Requests</button>
      </nav>
      <div class="sidebar-footer"><div class="mini-avatar">SK</div><div><b>Shekha</b><small>Administrator</small></div><button class="icon-button" title="Settings">⚙</button></div>
    </aside>
    <main class="main-content">
      <header class="topbar"><button class="menu-button" id="menuBtn">☰</button><div class="breadcrumb"><span>Workspace</span><b>/</b><strong id="pageTitle">Dashboard</strong></div><div class="top-actions"><button class="icon-button" title="Notifications">🔔<i></i></button><div class="date-chip">📅 <span id="todayLabel"></span></div></div></header>
      <div id="viewContainer"></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script>
const employees=[
{id:'EMP-001',name:'Arafat Hossain',bn:'আরাফাত হোসেন',role:'Senior Developer',dept:'Technology',email:'arafat@attendease.demo',color:'#d9e8ff',initials:'AH',photo:'https://attendease-fg9aeagt.manus.space/manus-storage/async-images/vFduByq8cIQiIESJDjHj29/image-1.webp',status:'Present'},
{id:'EMP-002',name:'Nusrat Jahan',bn:'নুসরাত জাহান',role:'HR Executive',dept:'People & Culture',email:'nusrat@attendease.demo',color:'#ffe0ee',initials:'NJ',photo:'https://attendease-fg9aeagt.manus.space/manus-storage/async-images/vFduByq8cIQiIESJDjHj29/image-2.webp',status:'Present'},
{id:'EMP-003',name:'Tanvir Ahmed',bn:'তানভীর আহমেদ',role:'UI/UX Designer',dept:'Design',email:'tanvir@attendease.demo',color:'#dff6e9',initials:'TA',photo:'https://attendease-fg9aeagt.manus.space/manus-storage/async-images/vFduByq8cIQiIESJDjHj29/image-3.webp',status:'Late'},
{id:'EMP-004',name:'Sumaiya Rahman',bn:'সুমাইয়া রহমান',role:'Finance Officer',dept:'Finance',email:'sumaiya@attendease.demo',color:'#fff0ce',initials:'SR',photo:'https://attendease-fg9aeagt.manus.space/manus-storage/async-images/vFduByq8cIQiIESJDjHj29/image-4.webp',status:'Present'},
{id:'EMP-005',name:'Sakib Khan',bn:'সাকিব খান',role:'Marketing Officer',dept:'Marketing',email:'sakib@attendease.demo',color:'#e9ddff',initials:'SK',photo:'https://attendease-fg9aeagt.manus.space/manus-storage/async-images/vFduByq8cIQiIESJDjHj29/image-5.webp',status:'Present'},
{id:'EMP-006',name:'Moumita Das',bn:'মৌমিতা দাস',role:'QA Engineer',dept:'Technology',email:'moumita@attendease.demo',color:'#ffe1d5',initials:'MD',photo:'https://attendease-fg9aeagt.manus.space/manus-storage/async-images/YqnxVAmIsHhnxt7I19SCHe/image-1.webp',status:'Absent'},
{id:'EMP-007',name:'Fahim Chowdhury',bn:'ফাহিম চৌধুরী',role:'Operations Lead',dept:'Operations',email:'fahim@attendease.demo',color:'#d7f1f2',initials:'FC',photo:'https://attendease-fg9aeagt.manus.space/manus-storage/async-images/YqnxVAmIsHhnxt7I19SCHe/image-2.webp',status:'Present'},
{id:'EMP-008',name:'Jannatul Ferdous',bn:'জান্নাতুল ফেরদৌস',role:'Customer Success',dept:'Support',email:'jannatul@attendease.demo',color:'#f5e2ff',initials:'JF',photo:'https://attendease-fg9aeagt.manus.space/manus-storage/async-images/YqnxVAmIsHhnxt7I19SCHe/image-3.webp',status:'Present'}
];
let leaves=JSON.parse(localStorage.getItem('attendease_leaves')||'[]');
const root=document.getElementById('viewContainer');
const dateText=new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'short',year:'numeric'}).format(new Date()); document.getElementById('todayLabel').textContent=dateText;
const avatar=e=>`<div class="avatar" style="background:${e.color};color:#3b4350">${e.photo?`<img src="${e.photo}" alt="Synthetic portrait of ${e.name}" loading="lazy" onerror="this.style.display='none'"/>`:''}<span>${e.initials}</span></div>`;
const status=e=>`<span class="status ${e.toLowerCase()}">${e}</span>`;
function layout(view='dashboard'){document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.view===view));document.getElementById('pageTitle').textContent={dashboard:'Dashboard',employees:'Employees',attendance:'Attendance',leave:'Leave Requests'}[view]; if(view==='dashboard')dashboard(); if(view==='employees')employeePage(); if(view==='attendance')attendancePage(); if(view==='leave')leavePage();}
function dashboard(){root.innerHTML=`<section class="page"><div class="page-heading"><div><div class="eyebrow">Good morning, Shekha</div><h1>People overview</h1><p class="subtitle">A clear snapshot of your team’s attendance today.</p></div><button class="primary-btn" onclick="layout('leave')">＋ New leave request</button></div><div class="stats-grid"><div class="stat-card"><div><h3>Total employees</h3><div class="stat-value">${employees.length}</div><div class="stat-note">↑ 2 this month</div></div><div class="stat-icon">♙</div></div><div class="stat-card"><div><h3>Present today</h3><div class="stat-value">${employees.filter(e=>e.status==='Present').length}</div><div class="stat-note">92% attendance rate</div></div><div class="stat-icon">✓</div></div><div class="stat-card"><div><h3>On leave</h3><div class="stat-value">${leaves.filter(l=>l.status==='Pending').length||2}</div><div class="stat-note" style="color:var(--orange)">Needs review</div></div><div class="stat-icon" style="background:var(--orange-bg);color:var(--orange)">▣</div></div><div class="stat-card"><div><h3>Absent today</h3><div class="stat-value">${employees.filter(e=>e.status==='Absent').length}</div><div class="stat-note" style="color:var(--red)">Follow up needed</div></div><div class="stat-icon" style="background:var(--red-bg);color:var(--red)">!</div></div></div><div class="content-grid"><div class="panel"><div class="panel-header"><h2>Today’s attendance</h2><a onclick="layout('attendance')">View full log →</a></div><div class="panel-body">${employees.slice(0,5).map(e=>`<div class="employee-row">${avatar(e)}<div class="employee-info"><b>${e.name}</b><small class="name-bn">${e.bn}</small><small>${e.role}</small></div>${status(e.status)}</div>`).join('')}</div></div><div class="panel"><div class="panel-header"><h2>Recent activity</h2><a>All activity</a></div><div class="panel-body"><div class="activity"><div class="activity-dot"></div><div><b>Nusrat submitted a leave request</b><small>Annual leave · 18 minutes ago</small></div></div><div class="activity"><div class="activity-dot" style="background:#16a085"></div><div><b>Arafat checked in</b><small>09:02 AM · Today</small></div></div><div class="activity"><div class="activity-dot" style="background:#f59e0b"></div><div><b>Monthly report is ready</b><small>Attendance summary · Yesterday</small></div></div></div></div></div></section>`;}
function employeePage(){root.innerHTML=`<section class="page"><div class="page-heading"><div><div class="eyebrow">People directory</div><h1>Employees</h1><p class="subtitle">Manage your team and view basic profile information.</p></div><button class="primary-btn" onclick="showToast('Demo mode: connect a backend to add employees')">＋ Add employee</button></div><div class="toolbar"><input class="search" id="employeeSearch" placeholder="Search by name, role or department…" oninput="filterEmployees(this.value)"><select class="filter" id="deptFilter" onchange="filterEmployees(document.getElementById('employeeSearch').value)"><option value="">All departments</option>${[...new Set(employees.map(e=>e.dept))].map(d=>`<option>${d}</option>`).join('')}</select></div><div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>EMPLOYEE</th><th>DEPARTMENT</th><th>ROLE</th><th>EMAIL</th><th>STATUS</th></tr></thead><tbody id="employeeRows">${employeeRows(employees)}</tbody></table></div></div></section>`;}
function employeeRows(list){return list.map(e=>`<tr><td><div class="profile">${avatar(e)}<div><b>${e.name}</b><small class="muted">${e.bn}</small></div></div></td><td>${e.dept}</td><td>${e.role}</td><td>${e.email}</td><td>${status(e.status)}</td></tr>`).join('')||`<tr><td colspan="5" class="empty">No employees found.</td></tr>`}
function filterEmployees(q){let dept=document.getElementById('deptFilter')?.value||'';let list=employees.filter(e=>(`${e.name} ${e.role} ${e.dept}`).toLowerCase().includes(q.toLowerCase())&&(!dept||e.dept===dept));document.getElementById('employeeRows').innerHTML=employeeRows(list)}
function attendancePage(){root.innerHTML=`<section class="page"><div class="page-heading"><div><div class="eyebrow">Daily log</div><h1>Attendance</h1><p class="subtitle">Review attendance records for ${dateText}.</p></div><button class="secondary-btn" onclick="showToast('Attendance report downloaded (demo)')">⇩ Export report</button></div><div class="panel"><div class="panel-header"><h2>Attendance register</h2><span class="muted" style="font-size:12px">${employees.length} records</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>EMPLOYEE</th><th>DATE</th><th>CHECK IN</th><th>CHECK OUT</th><th>WORK HOURS</th><th>STATUS</th></tr></thead><tbody>${employees.map((e,i)=>`<tr><td><div class="profile">${avatar(e)}<div><b>${e.name}</b><small class="name-bn">${e.bn}</small></div></div></td><td>${dateText}</td><td>${e.status==='Absent'?'—':i%3===0?'09:02 AM':i%3===1?'08:55 AM':'09:18 AM'}</td><td>${e.status==='Absent'?'—':'05:10 PM'}</td><td>${e.status==='Absent'?'—':i%3===2?'7h 52m':'8h 08m'}</td><td>${status(e.status)}</td></tr>`).join('')}</tbody></table></div></div></section>`;}
function leavePage(){root.innerHTML=`<section class="page"><div class="page-heading"><div><div class="eyebrow">Time off workflow</div><h1>Leave requests</h1><p class="subtitle">Submit a request or review the current queue.</p></div></div><div class="content-grid"><div class="panel"><div class="panel-header"><h2>New leave request</h2></div><form id="leaveForm"><div class="form-grid"><div class="form-group"><label>Employee</label><select name="employee" required>${employees.map(e=>`<option>${e.name}</option>`).join('')}</select></div><div class="form-group"><label>Leave type</label><select name="type"><option>Annual leave</option><option>Sick leave</option><option>Personal leave</option></select></div><div class="form-group"><label>Start date</label><input type="date" name="start" required></div><div class="form-group"><label>End date</label><input type="date" name="end" required></div><div class="form-group full"><label>Reason</label><textarea name="reason" placeholder="Add a short reason…" required></textarea></div></div><div class="form-actions"><button type="reset" class="secondary-btn">Clear</button><button class="primary-btn">Submit request</button></div></form></div><div class="panel"><div class="panel-header"><h2>Request status</h2></div><div class="panel-body">${leaves.length?leaves.map(l=>`<div class="activity"><div class="activity-dot" style="background:#f59e0b"></div><div><b>${l.employee}</b><small>${l.type} · ${l.start} to ${l.end}</small><span class="status late" style="display:inline-block;margin-top:7px">${l.status}</span></div></div>`).join(''):`<div class="empty">No new requests yet.<br><span class="muted">Submitted requests will appear here.</span></div>`}</div></div></div></section>`;document.getElementById('leaveForm').addEventListener('submit',e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));data.status='Pending';leaves.unshift(data);localStorage.setItem('attendease_leaves',JSON.stringify(leaves));showToast('Leave request submitted');leavePage()})}
function showToast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>{layout(b.dataset.view);document.getElementById('sidebar').classList.remove('open')}));document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));layout();

  </script>
</body>
</html>
